<svg viewBox="0 0 700 1010" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.c-purple>text.th{fill:#534AB7}.c-blue>rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:1}.c-blue>text.th{fill:#185FA5}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.c-teal>text.th{fill:#0F6E56}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.c-gray>text.th{fill:#5F5E5A}.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1}.c-amber>text.th{fill:#854F0B}.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1}.c-green>text.th{fill:#3B6D11}</style><rect width='100%' height='100%' fill='#FFFFFF'/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><g class="c-gray"><rect x="150" y="10" width="400" height="58" rx="8"/><text class="th" x="350" y="33" text-anchor="middle">reset(seed): a new day</text><text class="ts" x="350" y="53" text-anchor="middle">hidden beam + misalignments; we see BPMs, FEH-SCR-01, target (mu, sigma)</text></g><line class="arr" x1="350" y1="68" x2="350" y2="88" marker-end="url(#ah)"/><g class="c-purple"><rect x="100" y="90" width="500" height="76" rx="8"/><text class="th" x="350" y="112" text-anchor="middle">Model, free: target optics + responses</text><text class="ts" x="350" y="132" text-anchor="middle">VBC-on node table at (sigma_x, sigma_y), re-match FEA Q15/16, FEH Q1/2 in the</text><text class="ts" x="350" y="150" text-anchor="middle">error-free Cheetah twin; read R (orbit vs 58 correctors) from the table</text></g><line class="arr" x1="350" y1="166" x2="350" y2="186" marker-end="url(#ah)"/><g class="c-blue"><rect x="150" y="188" width="400" height="44" rx="8"/><text class="th" x="350" y="215" text-anchor="middle">Step 1: load the target optics (k1)</text></g><line class="arr" x1="350" y1="232" x2="350" y2="252" marker-end="url(#ah)"/><g class="c-blue"><rect x="100" y="254" width="500" height="76" rx="8"/><text class="th" x="350" y="276" text-anchor="middle">Thread (up to 8 shots, only if beam is lost)</text><text class="ts" x="350" y="296" text-anchor="middle">crop R to the BPMs that read + correctors upstream, SVD kick;</text><text class="ts" x="350" y="314" text-anchor="middle">undo a shot that loses ground and keep fewer modes; until all BPMs read</text></g><line class="arr" x1="350" y1="330" x2="350" y2="350" marker-end="url(#ah)"/><g class="c-blue"><rect x="100" y="352" width="500" height="58" rx="8"/><text class="th" x="350" y="374" text-anchor="middle">Steer: 2 SVD orbit shots, then up to 3 spot shots</text><text class="ts" x="350" y="394" text-anchor="middle">orbit to the model's orbit; FEH HVCOR 01/02 put the centroid on target</text></g><line class="arr" x1="350" y1="410" x2="350" y2="430" marker-end="url(#ah)"/><text class="ts" x="610" y="426" text-anchor="end">end of stage A (about 5 steps)</text><g class="c-purple"><rect x="100" y="432" width="500" height="76" rx="8"/><text class="th" x="350" y="454" text-anchor="middle">MF-BO low fidelity, free: the twin, one batched Cheetah track</text><text class="ts" x="350" y="474" text-anchor="middle">256 Sobol points over 7 knobs (FEA Q14/15/16, FEH Q1/2, 2 sextupoles)</text><text class="ts" x="350" y="492" text-anchor="middle">about the stage A values; one GP per readout (mu_x, mu_y, sig_x, sig_y, T)</text></g><line class="arr" x1="350" y1="508" x2="350" y2="528" marker-end="url(#ah)"/><g class="c-teal"><rect x="60" y="530" width="580" height="250" rx="10"/><text class="th" x="80" y="554">MF-BO loop on the machine (one step per shot)</text></g><g class="c-gray"><rect x="90" y="568" width="520" height="40" rx="6"/><text class="t" x="350" y="593" text-anchor="middle">machine = model GP + discrepancy (offset, then a GP from 3 readings)</text></g><line class="arr" x1="350" y1="608" x2="350" y2="622" marker-end="url(#ah)"/><g class="c-gray"><rect x="90" y="624" width="520" height="40" rx="6"/><text class="t" x="350" y="649" text-anchor="middle">propose x: max expected improvement of the benchmark mismatch</text></g><line class="arr" x1="350" y1="664" x2="350" y2="678" marker-end="url(#ah)"/><g class="c-gray"><rect x="90" y="680" width="520" height="40" rx="6"/><text class="t" x="350" y="705" text-anchor="middle">set x + FEH correctors cancelling the predicted centroid; read</text></g><line class="arr" x1="350" y1="720" x2="350" y2="734" marker-end="url(#ah)"/><g class="c-amber"><rect x="150" y="736" width="400" height="34" rx="6"/><text class="t" x="350" y="758" text-anchor="middle">EI below the cost of one more step, or no budget?</text></g><path class="arr" d="M150 753 L72 753 L72 588 L88 588" marker-end="url(#ah)"/><text class="ts" x="78" y="745">no</text><line class="arr" x1="350" y1="770" x2="350" y2="800" marker-end="url(#ah)"/><text class="ts" x="358" y="790">yes</text><g class="c-blue"><rect x="150" y="802" width="400" height="58" rx="8"/><text class="th" x="350" y="824" text-anchor="middle">Return to the best reading</text><text class="ts" x="350" y="844" text-anchor="middle">re-set its magnets if it was not the last shot (one step)</text></g><line class="arr" x1="350" y1="860" x2="350" y2="880" marker-end="url(#ah)"/><g class="c-green"><rect x="100" y="882" width="500" height="60" rx="8"/><text class="th" x="350" y="905" text-anchor="middle">Score: last reading of FEH-SCR-01</text><text class="ts" x="350" y="925" text-anchor="middle">mismatch in spot sizes + 2 (1 - T), capped at 10, + 0.5 log2(1 + steps/50)</text></g><g class="c-purple"><rect x="110" y="966" width="16" height="14" rx="3"/></g><text class="ts" x="134" y="978">model only, costs no step</text><g class="c-blue"><rect x="320" y="966" width="16" height="14" rx="3"/></g><text class="ts" x="344" y="978">machine shots, each costs a step (max 50)</text></svg>
